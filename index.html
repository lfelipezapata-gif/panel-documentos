<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tablero de documentos</title>
<style>
:root{
  --navy:#0B1F3A; --navy2:#122c52; --oro:#C9A84C; --oro-t:#DCC079;
  --slate:#AEBCCE; --card:#14315b; --line:#25456f;
  --rojo:#E5484D; --naranja:#F2851E; --amarillo:#E8C33D; --azul:#4C9AE8; --verde:#3FA96B; --gris:#7C8DA4; --morado:#A879D8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:#fff;font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px;padding-bottom:60px}
.wrap{max-width:1100px;margin:0 auto}
header{margin-bottom:18px}
h1{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--slate);font-size:.9rem;margin-top:4px}
.upd{color:var(--gris);font-size:.78rem;margin-top:6px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;cursor:pointer;transition:.15s;user-select:none}
.tile:hover{transform:translateY(-2px)}
.tile.on{border-color:var(--oro);background:var(--navy2);box-shadow:0 0 0 2px rgba(201,168,76,.28)}
.tile .n{font-size:2.1rem;font-weight:800;line-height:1}
.tile .l{font-size:.78rem;color:var(--slate);margin-top:6px;letter-spacing:.02em}
.t-rojo .n{color:var(--rojo)} .t-naranja .n{color:var(--naranja)} .t-amarillo .n{color:var(--amarillo)}
.t-azul .n{color:var(--azul)} .t-verde .n{color:var(--verde)} .t-todo .n{color:var(--oro-t)} .t-morado .n{color:var(--morado)}

.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
input[type=search]{flex:1;min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:#fff;padding:13px 15px;font-size:1rem}
input[type=search]::placeholder{color:var(--gris)}
.btn{background:var(--oro);color:var(--navy);border:0;border-radius:12px;padding:13px 18px;font-size:.95rem;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;color:var(--oro-t);border:1px solid var(--line)}

.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--gris);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.card.c-rojo{border-left-color:var(--rojo)} .card.c-naranja{border-left-color:var(--naranja)}
.card.c-amarillo{border-left-color:var(--amarillo)} .card.c-azul{border-left-color:var(--azul)}
.card.c-verde{border-left-color:var(--verde);opacity:.72}
.card.c-morado{border-left-color:var(--morado)}
.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.estado{font-size:.95rem;font-weight:800;white-space:nowrap}
.e-rojo{color:var(--rojo)} .e-naranja{color:var(--naranja)} .e-amarillo{color:var(--amarillo)}
.e-azul{color:var(--azul)} .e-verde{color:var(--verde)} .e-gris{color:var(--gris)} .e-morado{color:var(--morado)}
.asunto{font-size:1.06rem;font-weight:600;line-height:1.35;flex:1;min-width:240px}
.flechas{color:var(--oro-t);font-size:.83rem;margin-top:8px;font-weight:600}
.meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:.85rem;color:var(--slate)}
.meta b{color:#fff;font-weight:600}
.nota{margin-top:10px;font-size:.83rem;color:var(--slate);background:rgba(255,255,255,.04);border-radius:8px;padding:8px 11px}
.nota.alerta{color:#ffd7d8;background:rgba(229,72,77,.13)}
.vacio{text-align:center;color:var(--gris);padding:50px 20px}
.cargando{text-align:center;color:var(--slate);padding:60px 20px;font-size:1.05rem}
footer{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);color:var(--gris);font-size:.78rem;text-align:center}
@media(max-width:600px){
  body{padding:12px;padding-bottom:50px} h1{font-size:1.22rem}
  .tile .n{font-size:1.7rem} .asunto{font-size:1rem}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="titulo">Tablero de documentos</h1>
    <div class="sub" id="subtitulo">&nbsp;</div>
    <div class="upd" id="upd">Cargando…</div>
  </header>

  <div class="tiles" id="tiles"></div>

  <div class="bar">
    <input type="search" id="q" placeholder="Buscar por asunto, empresa o persona…">
    <button class="btn" onclick="cargar()">Actualizar</button>
    <a class="btn alt" id="editar" target="_blank" rel="noopener">Registrar documento</a>
  </div>

  <div id="lista"><div class="cargando">Cargando el tablero…</div></div>

  <footer>
    Los tiempos se cuentan en días hábiles con los festivos colombianos.<br>
    Se actualiza solo cada minuto. Documento de trabajo interno.
  </footer>
</div>

<script>
const SHEET=(location.hash||"").replace(/^#/,"").trim();
const HOJA="Hoja 1";
if(!SHEET){
  document.getElementById('lista').innerHTML='<div class="vacio">Falta el enlace completo del tablero.<br>Pídalo de nuevo a quien se lo compartió.</div>';
  document.getElementById('upd').textContent="";
}
if(SHEET) document.getElementById('editar').href="https://docs.google.com/spreadsheets/d/"+SHEET+"/edit";

let DATOS=[], filtro="todo";

const GRUPOS={
  todo:      {l:"TODOS los documentos", f:d=>true,                  c:"todo"},
  pendientes:{l:"Sin cerrar",       f:d=>d.sem!=="verde",           c:"todo"},
  rojo:      {l:"Vencidos",         f:d=>d.sem==="rojo",            c:"rojo"},
  naranja:   {l:"Vencen ya",        f:d=>d.sem==="naranja",         c:"naranja"},
  amarillo:  {l:"Esta semana",      f:d=>d.sem==="amarillo",        c:"amarillo"},
  azul:      {l:"En plazo",         f:d=>d.sem==="azul",            c:"azul"},
  morado:    {l:"Por verificar",    f:d=>d.sem==="morado",          c:"morado"},
  verde:     {l:"Cerrados",         f:d=>d.sem==="verde",           c:"verde"}
};

function semDe(txt){
  if(!txt) return "gris";
  if(txt.indexOf("🔴")>=0) return "rojo";
  if(txt.indexOf("🟠")>=0) return "naranja";
  if(txt.indexOf("🟡")>=0) return "amarillo";
  if(txt.indexOf("🔵")>=0) return "azul";
  if(txt.indexOf("🟣")>=0) return "morado";
  if(txt.indexOf("🟢")>=0) return "verde";
  return "gris";
}
function etiqueta(d){
  if(d.sem==="verde") return "Cerrado";
  if(d.sem==="morado") return "¿Contestaron?";
  if(d.sem==="gris")  return d.estado||"Sin término";
  const n=parseInt(d.faltan,10);
  if(isNaN(n)) return d.estado||"";
  if(n<0)  return "Vencido hace "+Math.abs(n)+(Math.abs(n)===1?" día hábil":" días hábiles");
  if(n===0)return "Vence HOY";
  if(n===1)return "Vence MAÑANA";
  return "Faltan "+n+(n===1?" día hábil":" días hábiles");
}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

window.cb=function(resp){
  const filas=resp.table.rows||[];
  try{
    const enc=(resp.table.cols||[])[0];
    const t0=(filas[0]&&filas[0].c&&filas[0].c[0]&&filas[0].c[0].v)||(enc&&enc.label)||"";
    const partes=String(t0).split("·");
    if(partes.length>1){
      document.getElementById('titulo').textContent=partes[0].trim();
      document.getElementById('subtitulo').textContent=partes.slice(1).join("·").trim();
    }
  }catch(e){}
  DATOS=[];
  filas.forEach(r=>{
    const c=r.c||[];
    const g=i=>(c[i]&&c[i].f!=null)?String(c[i].f):((c[i]&&c[i].v!=null)?String(c[i].v):"");
    const num=g(0);
    if(!num || isNaN(parseInt(num,10))) return;
    const d={
      n:num, dir:g(1), fdoc:g(2), frec:g(3), de:g(4), para:g(5), rad:g(6),
      asunto:g(7), parte:g(8), req:g(9), regla:g(10), dias:g(11),
      vence:g(12), faltan:g(13), estado:g(14), fresp:g(15), cerr:g(16),
      tomo:g(17), resp:g(18), notas:g(19), semTxt:g(20)
    };
    d.sem=semDe(d.semTxt);
    DATOS.push(d);
  });
  pintar();
  document.getElementById('upd').textContent="Actualizado a las "+new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})+" · "+DATOS.length+" documentos";
};

function cargar(){
  const s=document.createElement('script');
  s.src="https://docs.google.com/spreadsheets/d/"+SHEET+"/gviz/tq?tqx=responseHandler:cb&sheet="+encodeURIComponent(HOJA)+"&t="+Date.now();
  s.onerror=()=>{document.getElementById('lista').innerHTML='<div class="vacio">No se pudo cargar. Revise la conexión y toque Actualizar.</div>';};
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),8000);
}

function pintar(){
  const cont=document.getElementById('tiles');
  cont.innerHTML="";
  Object.keys(GRUPOS).forEach(k=>{
    const g=GRUPOS[k], n=DATOS.filter(g.f).length;
    const el=document.createElement('div');
    el.className="tile t-"+g.c+(filtro===k?" on":"");
    el.innerHTML='<div class="n">'+n+'</div><div class="l">'+g.l+'</div>';
    el.onclick=()=>{filtro=k;pintar();};
    cont.appendChild(el);
  });

  const q=(document.getElementById('q').value||"").toLowerCase().trim();
  const orden={rojo:0,naranja:1,amarillo:2,azul:3,morado:4,gris:5,verde:6};
  let l=DATOS.filter(GRUPOS[filtro].f);
  if(q) l=l.filter(d=>(d.asunto+" "+d.parte+" "+d.resp+" "+d.de+" "+d.para+" "+d.rad+" "+d.notas).toLowerCase().indexOf(q)>=0);
  l.sort((a,b)=>{
    const oa=orden[a.sem],ob=orden[b.sem];
    if(oa!==ob) return oa-ob;
    const fa=parseInt(a.faltan,10), fb=parseInt(b.faltan,10);
    if(!isNaN(fa)&&!isNaN(fb)) return fa-fb;
    return 0;
  });

  const box=document.getElementById('lista');
  if(!l.length){box.innerHTML='<div class="vacio">No hay documentos en este grupo.</div>';return;}
  box.innerHTML=l.map(d=>{
    const alerta=/FALTA|URGENTE|Verificar|sin contestar/i.test(d.notas||"");
    return '<div class="card c-'+d.sem+'">'+
      '<div class="top">'+
        '<div class="asunto">'+esc(d.asunto)+'</div>'+
        '<div class="estado e-'+d.sem+'">'+esc(etiqueta(d))+'</div>'+
      '</div>'+
      '<div class="flechas">'+(d.dir==="ENTRA"?"◀ nos lo mandaron":(d.dir==="SALE"?"▶ lo mandamos":"● hito"))+
        ' &nbsp;·&nbsp; '+esc(d.de)+' → '+esc(d.para)+'</div>'+
      '<div class="meta">'+
        (d.vence?'<span>Vence: <b>'+esc(d.vence)+'</b></span>':'')+
        (d.frec||d.fdoc?'<span>Fecha: <b>'+esc(d.frec||d.fdoc)+'</b></span>':'')+
        (d.resp?'<span>Responsable: <b>'+esc(d.resp)+'</b></span>':'')+
        (d.rad?'<span>Radicado: <b>'+esc(d.rad)+'</b></span>':'')+
        (d.sem==="verde"&&d.tomo?'<span>Tomó <b>'+esc(d.tomo)+' días</b></span>':'')+
        (d.sem==="verde"&&d.cerr?'<span>Cerrado con: <b>'+esc(d.cerr)+'</b></span>':'')+
      '</div>'+
      (d.notas?'<div class="nota'+(alerta?' alerta':'')+'">'+esc(d.notas)+'</div>':'')+
    '</div>';
  }).join("");
}

document.getElementById('q').addEventListener('input',pintar);
if(SHEET){cargar();setInterval(cargar,60000);}
</script>
</body>
</html>
